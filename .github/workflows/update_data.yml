name: Daily Schedule Update

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリのインストール
        run: pip install -r requirements.txt

      - name: スクレイピング＆HTML生成実行
        run: python scraper.py

      - name: 生成されたHTMLを保存
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html cache.json weekly.docx newsletter.xlsx radio_history.json letsgo_*.docx first_seen.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update schedule HTML" && git push)
